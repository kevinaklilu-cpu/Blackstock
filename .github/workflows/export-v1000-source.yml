name: Blackstock Source Export

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'blackstock-build-payload.zip'
      - 'Patches/WachstumView.swift'
      - 'Patches/apply-v12.py'
      - 'Patches/apply-v13.py'
      - 'Patches/V25/**'
      - 'Patches/Release50/**'
      - 'Patches/Release100/**'
      - 'Patches/Release1000/**'
      - '.github/workflows/export-v1000-source.yml'

permissions:
  contents: read

concurrency:
  group: blackstock-canonical-source
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Blackstock kanonisch rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          grep -q '^APP_VERSION=1.0.0$' "$GITHUB_WORKSPACE/Build/version.env"
          grep -q '^BUILD_NUMBER=100$' "$GITHUB_WORKSPACE/Build/version.env"
          grep -q '^Product: Blackstock$' "$GITHUB_WORKSPACE/RELEASE_MANIFEST.txt"
          "$GITHUB_WORKSPACE/Build/Market-Readiness-Audit.sh"

      - name: Source-Paket erzeugen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          /usr/bin/ditto -c -k --keepParent "$GITHUB_WORKSPACE/Sources" "$RUNNER_TEMP/export/Sources.zip"
          cp -R "$GITHUB_WORKSPACE/Build" "$RUNNER_TEMP/export/Build"
          cp -R "$GITHUB_WORKSPACE/Tests" "$RUNNER_TEMP/export/Tests"
          cp "$GITHUB_WORKSPACE/RELEASE_MANIFEST.txt" "$RUNNER_TEMP/export/"
          cp "$GITHUB_WORKSPACE"/RELEASE_NOTES_v*.md "$RUNNER_TEMP/export/" 2>/dev/null || true
          cd "$RUNNER_TEMP/export"
          /usr/bin/ditto -c -k --keepParent . "$RUNNER_TEMP/Blackstock-authoritative-source.zip"

      - name: Blackstock Source hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Blackstock-authoritative-source
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/Blackstock-authoritative-source.zip

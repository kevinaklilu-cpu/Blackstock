name: Blackstock macOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'blackstock-build-payload.zip'
      - 'Patches/WachstumView.swift'
      - 'Patches/apply-v12.py'
      - 'Patches/apply-v13.py'
      - 'Patches/V25/**'
      - 'Patches/Release50/**'
      - 'Patches/Release100/**'
      - 'Patches/Release1000/**'
      - '.github/workflows/macos-build-v1000.yml'

permissions:
  contents: read

concurrency:
  group: blackstock-canonical-build
  cancel-in-progress: true

jobs:
  build-blackstock:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Blackstock kanonisch rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          bash -x "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"

      - name: Source-Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Blackstock-source-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            Sources/Blackstock/Views/CreatorOS1000View.swift
            Sources/Blackstock/Views/CreatorBusinessWorkspaceView.swift
            Sources/Blackstock/Views/ChancenView.swift
            Sources/Blackstock/Views/ProduktionsDetailView.swift
            Sources/Blackstock/Views/YouTubePlayerView.swift
            Sources/Blackstock/Views/RootView.swift
            Sources/Blackstock/Views/SidebarView.swift
            Sources/Blackstock/AppStore+V11.swift
            Sources/Blackstock/AppStore+V26.swift
            Sources/Blackstock/AppStore+V1000.swift
            Sources/Blackstock/Models/Blackstock1000Models.swift
            Sources/Blackstock/Services/CreatorOS1000Service.swift
            Sources/Blackstock/Services/TrendFeedScoreService.swift
            Sources/Blackstock/Services/YouTubeService.swift
            Sources/Blackstock/Services/NextBestActionService.swift
            Build/Release-Audit.sh
            Build/Market-Readiness-Audit.sh

      - name: Release-Metadaten laden
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/Build/version.env"
          set +a
          test "$APP_VERSION" = "1.0.0"
          test "$BUILD_NUMBER" = "100"
          grep -q '^Product: Blackstock$' "$GITHUB_WORKSPACE/RELEASE_MANIFEST.txt"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MIN_MACOS=$MIN_MACOS" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swiftc --version
          sw_vers

      - name: Portable Regression Suite
        shell: bash
        run: "$GITHUB_WORKSPACE/Build/Core-Tests.sh"

      - name: Vollständiger Release-Audit
        shell: bash
        run: |
          set -euo pipefail
          SWIFTC="$(xcrun --sdk macosx --find swiftc)" \
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          SWIFT_TARGET="arm64-apple-macosx${MIN_MACOS}" \
          "$GITHUB_WORKSPACE/Build/Release-Audit.sh"

      - name: Market-Readiness-Audit
        shell: bash
        run: "$GITHUB_WORKSPACE/Build/Market-Readiness-Audit.sh"

      - name: Blackstock.app bauen
        shell: zsh {0}
        env:
          BLACKSTOCK_APP_OUTPUT: ${{ github.workspace }}/dist/Blackstock.app
          BLACKSTOCK_BUILD_DIR: ${{ runner.temp }}/blackstock-native-build
          BLACKSTOCK_BUILD_LOG: ${{ runner.temp }}/Blackstock-Buildprotokoll.txt
          BLACKSTOCK_SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$GITHUB_WORKSPACE/Build/build-app.zsh"

      - name: App-Bundle verifizieren
        shell: zsh {0}
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/Blackstock.app"
          plutil -lint "$APP/Contents/Info.plist"
          lipo "$APP/Contents/MacOS/Blackstock" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")" = "Blackstock"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$BUILD_NUMBER"

      - name: Start-Smoke-Test
        shell: zsh {0}
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/Blackstock.app"
          "$APP/Contents/MacOS/Blackstock" >"$RUNNER_TEMP/blackstock-smoke.log" 2>&1 &
          PID=$!
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/blackstock-smoke.log"
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true

      - name: Blackstock DMG und ZIP erzeugen
        shell: zsh {0}
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/Blackstock.app"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          /usr/bin/ditto "$APP" "$STAGE/Blackstock.app"
          ln -s /Applications "$STAGE/Programme"
          cp "$GITHUB_WORKSPACE/Distribution/INSTALLIEREN.txt" "$STAGE/INSTALLIEREN.txt"
          cd "$GITHUB_WORKSPACE/dist"
          DMG="Blackstock.dmg"
          ZIP="Blackstock.zip"
          hdiutil create -volname "Blackstock" -srcfolder "$STAGE" -ov -format UDZO "$DMG" >/dev/null
          hdiutil verify "$DMG" >/dev/null
          shasum -a 256 "$DMG" > "$DMG.sha256"
          /usr/bin/ditto -c -k --keepParent Blackstock.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"

      - name: Blackstock hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Blackstock-macOS
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Blackstock.dmg
            dist/Blackstock.dmg.sha256
            dist/Blackstock.zip
            dist/Blackstock.zip.sha256

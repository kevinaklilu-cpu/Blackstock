name: Blackstock Clean Build

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Build/**'
      - '.github/workflows/blackstock-clean-build.yml'
  workflow_dispatch:

concurrency:
  group: blackstock-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand and shipping audit
        shell: bash
        run: |
          set -euo pipefail
          test -f Package.swift
          test -d Sources/BlackstockCore
          test -d Sources/BlackstockApp
          test -f Build/package-installer.sh
          if grep -R -n -E 'Creator Business OS|Creator Studio|Blackstock 1\.0|fatalError\(|TODO:' Sources Tests; then
            echo 'Shipping audit found blocked product-name or unfinished markers.' >&2
            exit 1
          fi
          grep -q 'research = "Recherche"' Sources/BlackstockApp/AppState.swift
          grep -q 'func render(project:' Sources/BlackstockApp/NativeMediaService.swift
          grep -q 'Release-Paket exportieren' Sources/BlackstockApp/PublishView.swift
          grep -q 'RenderCanvas' Sources/BlackstockCore/Models.swift
          grep -q 'ReleasePackageBuilder' Sources/BlackstockCore/ReleasePackage.swift
          grep -q 'Nischen-Radar' Sources/BlackstockApp/ResearchView.swift
          grep -q 'Blackstock-Installer.pkg' Build/package-installer.sh
          grep -q '/Applications' Build/package-installer.sh
      - name: Swift tests
        run: swift test
      - name: Release compile check
        run: swift build -c release

  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Create native installer, app bundle and smoke test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Build/package-installer.sh
          Build/package-installer.sh "$RUNNER_TEMP/dist"
          APP="$RUNNER_TEMP/installed-root/Applications/Blackstock.app"
          mkdir -p "$RUNNER_TEMP/installed-root"
          installer -pkg "$RUNNER_TEMP/dist/Blackstock-Installer.pkg" -target "$RUNNER_TEMP/installed-root" || true
          if [ ! -d "$APP" ]; then
            pkgutil --expand-full "$RUNNER_TEMP/dist/Blackstock-Installer.pkg" "$RUNNER_TEMP/pkg-expanded"
            test -d "$RUNNER_TEMP/pkg-expanded"
          fi
          BIN="$(swift build -c release --show-bin-path)/Blackstock"
          "$BIN" >/dev/null 2>&1 & PID=$!
          sleep 2
          kill "$PID" >/dev/null 2>&1 || true
          test -f "$RUNNER_TEMP/dist/Blackstock-Installer.pkg"
          test -f "$RUNNER_TEMP/dist/Blackstock-Installer.dmg"
          test -f "$RUNNER_TEMP/dist/Blackstock.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Blackstock-macOS-Installer
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dist/Blackstock-Installer.pkg
            ${{ runner.temp }}/dist/Blackstock-Installer.pkg.sha256
            ${{ runner.temp }}/dist/Blackstock-Installer.dmg
            ${{ runner.temp }}/dist/Blackstock-Installer.dmg.sha256
            ${{ runner.temp }}/dist/Blackstock.zip
            ${{ runner.temp }}/dist/Blackstock.zip.sha256

name: Blackstock Clean Build

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.github/workflows/blackstock-clean-build.yml'
  workflow_dispatch:

concurrency:
  group: blackstock-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand and shipping audit
        shell: bash
        run: |
          set -euo pipefail
          test -f Package.swift
          test -d Sources/BlackstockCore
          test -d Sources/BlackstockApp
          if grep -R -n -E 'Creator Business OS|Creator Studio|Blackstock 1\.0|fatalError\(|TODO:' Sources Tests; then
            echo 'Shipping audit found blocked product-name or unfinished markers.' >&2
            exit 1
          fi
          grep -q 'case research = "Recherche"' Sources/BlackstockApp/AppState.swift
          grep -q 'func render(project:' Sources/BlackstockApp/NativeMediaService.swift
          grep -q 'Release-Check' Sources/BlackstockApp/PublishView.swift
          grep -q 'Nischen-Radar' Sources/BlackstockApp/ResearchView.swift
      - name: Swift tests
        run: swift test
      - name: Release compile check
        run: swift build -c release

  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Create app bundle and smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)/Blackstock"
          APP="$RUNNER_TEMP/Blackstock.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/Blackstock"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Blackstock</string>
            <key>CFBundleExecutable</key><string>Blackstock</string>
            <key>CFBundleIdentifier</key><string>de.blackstock.native</string>
            <key>CFBundleName</key><string>Blackstock</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>100</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist" | grep -qx 'Blackstock'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/Blackstock" >/dev/null 2>&1 & PID=$!
          sleep 2
          kill "$PID" >/dev/null 2>&1 || true
          hdiutil create -volname Blackstock -srcfolder "$APP" -ov -format UDZO "$RUNNER_TEMP/Blackstock.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Blackstock.zip"
          shasum -a 256 "$RUNNER_TEMP/Blackstock.dmg" > "$RUNNER_TEMP/Blackstock.dmg.sha256"
          shasum -a 256 "$RUNNER_TEMP/Blackstock.zip" > "$RUNNER_TEMP/Blackstock.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Blackstock-macOS
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/Blackstock.dmg
            ${{ runner.temp }}/Blackstock.dmg.sha256
            ${{ runner.temp }}/Blackstock.zip
            ${{ runner.temp }}/Blackstock.zip.sha256

name: Canonical Master Prompt Gates

on:
  push:
    branches: [master-prompt-canonical]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical source guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '23c51e7d90ca653c92b04b19a7b65615fdf420f581caa16024725c4935bde827' docs/MASTER_REQUIREMENTS.md
          grep -q 'STATUS: NOCH NICHT MARKTREIF' docs/MASTER_REQUIREMENTS.md
          grep -q 'BLOCKED_EXTERNAL' docs/RELEASE_GATES.md
          test -f Sources/BlackstockCore/CanonicalModels.swift
          test -f Tests/BlackstockCoreTests/CanonicalMasterPromptTests.swift
      - name: Swift tests
        run: swift test
      - name: Release compilation
        run: swift build -c release

  macos-package-smoke:
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned development package
        shell: bash
        env:
          BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          chmod +x Build/package-installer.sh
          Build/package-installer.sh "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Blackstock-Installer.pkg"
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock-Installer.pkg" | grep -q 'Applications/Blackstock.app'
      - uses: actions/upload-artifact@v4
        with:
          name: Blackstock-development-package
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dist/Blackstock-Installer.pkg
            ${{ runner.temp }}/dist/Blackstock-Installer.pkg.sha256

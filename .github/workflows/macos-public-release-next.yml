name: Blackstock Public Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/macos-public-release-next.yml'
      - 'Patches/**'
      - 'blackstock-build-payload.zip'

permissions:
  contents: read

concurrency:
  group: blackstock-public-release
  cancel-in-progress: false

jobs:
  signed-notarized-release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Blackstock rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          grep -q '^Product: Blackstock$' "$GITHUB_WORKSPACE/RELEASE_MANIFEST.txt"
          grep -q '^APP_VERSION=1.0.0$' "$GITHUB_WORKSPACE/Build/version.env"
          grep -q '^BUILD_NUMBER=100$' "$GITHUB_WORKSPACE/Build/version.env"
          "$GITHUB_WORKSPACE/Build/Market-Readiness-Audit.sh"

      - name: Produktions-OAuth sicher einbetten
        shell: bash
        env:
          GOOGLE_OAUTH_DESKTOP_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_DESKTOP_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_DESKTOP_JSON_BASE64" || { echo 'GOOGLE_OAUTH_DESKTOP_JSON_BASE64 fehlt'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/Resources"
          printf '%s' "$GOOGLE_OAUTH_DESKTOP_JSON_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/Resources/GoogleOAuth.json"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('Resources/GoogleOAuth.json')
          data = json.loads(p.read_text())
          desktop = data.get('installed') or data.get('web') or {}
          assert desktop.get('client_id'), 'OAuth client_id fehlt'
          assert desktop.get('auth_uri'), 'OAuth auth_uri fehlt'
          assert desktop.get('token_uri'), 'OAuth token_uri fehlt'
          print('BLACKSTOCK_OAUTH_RELEASE_CONFIG_OK')
          PY

      - name: Release-Regressionen und Audit
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/Build/version.env"
          set +a
          "$GITHUB_WORKSPACE/Build/Core-Tests.sh"
          SWIFTC="$(xcrun --sdk macosx --find swiftc)" \
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          SWIFT_TARGET="arm64-apple-macosx${MIN_MACOS}" \
          "$GITHUB_WORKSPACE/Build/Release-Audit.sh"
          "$GITHUB_WORKSPACE/Build/Market-Readiness-Audit.sh"

      - name: Developer-ID-Zertifikat importieren
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.BLACKSTOCK_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BLACKSTOCK_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.BLACKSTOCK_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERT_P12_BASE64" || { echo 'Developer-ID-P12 fehlt'; exit 1; }
          test -n "$CERT_PASSWORD" || { echo 'P12-Passwort fehlt'; exit 1; }
          test -n "$SIGN_IDENTITY" || { echo 'BLACKSTOCK_SIGN_IDENTITY fehlt'; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/blackstock-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/blackstock-release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/blackstock-release.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$SIGN_IDENTITY"

      - name: Apple-Notarisierung konfigurieren
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID" || { echo 'APPLE_NOTARY_APPLE_ID fehlt'; exit 1; }
          test -n "$TEAM_ID" || { echo 'APPLE_NOTARY_TEAM_ID fehlt'; exit 1; }
          test -n "$APP_PASSWORD" || { echo 'APPLE_NOTARY_APP_PASSWORD fehlt'; exit 1; }
          xcrun notarytool store-credentials blackstock-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Signiertes und notarisiertes Blackstock DMG bauen
        shell: zsh {0}
        env:
          BLACKSTOCK_APP_OUTPUT: ${{ github.workspace }}/dist/Blackstock.app
          BLACKSTOCK_BUILD_DIR: ${{ runner.temp }}/blackstock-public-build
          BLACKSTOCK_BUILD_LOG: ${{ runner.temp }}/Blackstock-Public-Build.txt
          BLACKSTOCK_SIGN_IDENTITY: ${{ secrets.BLACKSTOCK_SIGN_IDENTITY }}
          BLACKSTOCK_NOTARY_PROFILE: blackstock-notary
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/Build/create-dmg.zsh"

      - name: Produktionskonfiguration, Gatekeeper und Notarisierung verifizieren
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/Build/version.env"
          set +a
          APP="$GITHUB_WORKSPACE/dist/Blackstock.app"
          SOURCE_DMG="$GITHUB_WORKSPACE/dist/Blackstock-${APP_VERSION}-universal.dmg"
          FINAL_DMG="$GITHUB_WORKSPACE/dist/Blackstock.dmg"
          FINAL_ZIP="$GITHUB_WORKSPACE/dist/Blackstock.zip"
          test -f "$APP/Contents/Resources/GoogleOAuth.json" || { echo 'Produktions-OAuth fehlt im App-Bundle'; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('dist/Blackstock.app/Contents/Resources/GoogleOAuth.json')
          data = json.loads(p.read_text())
          desktop = data.get('installed') or data.get('web') or {}
          assert desktop.get('client_id')
          assert desktop.get('auth_uri')
          assert desktop.get('token_uri')
          print('BLACKSTOCK_OAUTH_BUNDLE_OK')
          PY
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$SOURCE_DMG"
          hdiutil verify "$SOURCE_DMG" >/dev/null
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$SOURCE_DMG"
          cp "$SOURCE_DMG" "$FINAL_DMG"
          /usr/bin/ditto -c -k --keepParent "$APP" "$FINAL_ZIP"
          shasum -a 256 "$FINAL_DMG" > "$FINAL_DMG.sha256"
          shasum -a 256 "$FINAL_ZIP" > "$FINAL_ZIP.sha256"

      - name: Blackstock veröffentlichungsfertig hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Blackstock-signed-notarized-macOS
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Blackstock.dmg
            dist/Blackstock.dmg.sha256
            dist/Blackstock.zip
            dist/Blackstock.zip.sha256

name: Blackstock Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version, z. B. 1.0.0"
        required: true
        type: string
      build:
        description: "Positive Build-Nummer"
        required: true
        type: string

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  BLACKSTOCK_RELEASE_TAG: v${{ inputs.version }}-build.${{ inputs.build }}
  BLACKSTOCK_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
  BLACKSTOCK_PACKAGE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}-build.${{ inputs.build }}/Blackstock.pkg

concurrency:
  group: blackstock-production-release
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pinned macOS toolchain guard
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          swift --version

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production releases must run from main." >&2
            exit 1
          }

          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"].strip()
          build = os.environ["BUILD"].strip()
          if not re.fullmatch(r"\d+(?:\.\d+){0,3}", version):
              raise SystemExit("version must be numeric dotted notation")
          if not build.isdigit() or int(build) <= 0:
              raise SystemExit("build must be a positive integer")
          PY

      - name: Resolve previous production baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$BLACKSTOCK_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $BLACKSTOCK_RELEASE_TAG" >&2
            exit 1
          fi

          PREVIOUS_VERSION="0.0.0"
          PREVIOUS_BUILD="1"
          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            mkdir -p "$PREVIOUS_DIR"
            if gh release download "$PREVIOUS_TAG" --pattern update-manifest.json --dir "$PREVIOUS_DIR" >/dev/null 2>&1; then
              read -r PREVIOUS_VERSION PREVIOUS_BUILD < <(
                python3 - "$PREVIOUS_DIR/update-manifest.json" <<'PY'
          import json
          import pathlib
          import sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(manifest["version"], manifest["build"])
          PY
              )
            fi
          fi

          echo "BLACKSTOCK_PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "BLACKSTOCK_PREVIOUS_BUILD=$PREVIOUS_BUILD" >> "$GITHUB_ENV"
      - name: Validate required production secrets
        env:
          APP_CERT: ${{ secrets.BLACKSTOCK_APP_CERT_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.BLACKSTOCK_APP_CERT_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.BLACKSTOCK_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.BLACKSTOCK_INSTALLER_CERT_PASSWORD }}
          APP_IDENTITY: ${{ secrets.BLACKSTOCK_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.BLACKSTOCK_INSTALLER_IDENTITY }}
          TEAM_ID: ${{ secrets.BLACKSTOCK_APPLE_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.BLACKSTOCK_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.BLACKSTOCK_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.BLACKSTOCK_NOTARY_ISSUER }}
          UPDATE_PRIVATE_KEY: ${{ secrets.BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY: ${{ secrets.BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64 }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in             APP_CERT             APP_CERT_PASSWORD             INSTALLER_CERT             INSTALLER_CERT_PASSWORD             APP_IDENTITY             INSTALLER_IDENTITY             TEAM_ID             NOTARY_KEY             NOTARY_KEY_ID             NOTARY_ISSUER             UPDATE_PRIVATE_KEY             UPDATE_PUBLIC_KEY             GOOGLE_OAUTH_CLIENT_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done

      - name: Verify update signing key pair
        env:
          BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64 }}
          BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64 }}
        run: swift Build/verify_update_key_pair.swift

      - name: Import Developer ID certificates
        env:
          APP_CERT: ${{ secrets.BLACKSTOCK_APP_CERT_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.BLACKSTOCK_APP_CERT_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.BLACKSTOCK_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.BLACKSTOCK_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/blackstock-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "BLACKSTOCK_RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "BLACKSTOCK_RELEASE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          python3 - "$RUNNER_TEMP/app-cert.p12" "$RUNNER_TEMP/installer-cert.p12" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["APP_CERT"], validate=True)
          )
          pathlib.Path(sys.argv[2]).write_bytes(
              base64.b64decode(os.environ["INSTALLER_CERT"], validate=True)
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          security import "$RUNNER_TEMP/app-cert.p12"             -k "$KEYCHAIN"             -P "$APP_CERT_PASSWORD"             -A             -T /usr/bin/codesign             -T /usr/bin/security

          security import "$RUNNER_TEMP/installer-cert.p12"             -k "$KEYCHAIN"             -P "$INSTALLER_CERT_PASSWORD"             -A             -T /usr/bin/productbuild             -T /usr/bin/productsign             -T /usr/bin/security

          security set-key-partition-list             -S apple-tool:,apple:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN"

          security find-identity -v "$KEYCHAIN"

      - name: Write notarization API key
        env:
          NOTARY_KEY: ${{ secrets.BLACKSTOCK_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "BLACKSTOCK_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          python3 - "$NOTARY_KEY_PATH" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(
                  os.environ["NOTARY_KEY"],
                  validate=True,
              )
          )
          PY
          chmod 600 "$NOTARY_KEY_PATH"

      - name: Verify configured identities and team
        env:
          APP_IDENTITY: ${{ secrets.BLACKSTOCK_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.BLACKSTOCK_INSTALLER_IDENTITY }}
          TEAM_ID: ${{ secrets.BLACKSTOCK_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          security find-identity -v "$BLACKSTOCK_RELEASE_KEYCHAIN"             | grep -F "$APP_IDENTITY"
          security find-identity -v "$BLACKSTOCK_RELEASE_KEYCHAIN"             | grep -F "$INSTALLER_IDENTITY"
          [[ "$APP_IDENTITY" == *"$TEAM_ID"* ]]
          [[ "$INSTALLER_IDENTITY" == *"$TEAM_ID"* ]]

      - name: Build sign and notarize production package
        env:
          BLACKSTOCK_VERSION: ${{ inputs.version }}
          BLACKSTOCK_BUILD: ${{ inputs.build }}
          BLACKSTOCK_SOURCE_COMMIT_SHA: ${{ github.sha }}
          BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
          BLACKSTOCK_CODESIGN_IDENTITY: ${{ secrets.BLACKSTOCK_CODESIGN_IDENTITY }}
          BLACKSTOCK_INSTALLER_IDENTITY: ${{ secrets.BLACKSTOCK_INSTALLER_IDENTITY }}
          BLACKSTOCK_NOTARY_KEY_ID: ${{ secrets.BLACKSTOCK_NOTARY_KEY_ID }}
          BLACKSTOCK_NOTARY_ISSUER: ${{ secrets.BLACKSTOCK_NOTARY_ISSUER }}
          BLACKSTOCK_NOTARY_EVIDENCE_PATH: ${{ runner.temp }}/dist/notary-response.json
          BLACKSTOCK_UPDATE_MANIFEST_URL: ${{ env.BLACKSTOCK_MANIFEST_URL }}
          BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64 }}
          BLACKSTOCK_UPDATE_INSTALLER_TEAM_ID: ${{ secrets.BLACKSTOCK_APPLE_TEAM_ID }}
          BLACKSTOCK_INCLUDE_E2E_SMOKE: "0"
          BLACKSTOCK_PRODUCTION_RELEASE: "1"
        run: |
          set -euo pipefail
          chmod +x Build/package.sh
          Build/package.sh "$RUNNER_TEMP/dist"

          test -s "$RUNNER_TEMP/dist/Blackstock.pkg"
          test -s "$RUNNER_TEMP/dist/Blackstock.pkg.sha256"
          test -s "$RUNNER_TEMP/dist/notary-response.json"

          if pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg"             | grep -q 'BlackstockE2ESmoke\|BlackstockReleaseVerifier'; then
            echo "Developer-only helper leaked into production package." >&2
            exit 1
          fi

      - name: Generate signed production update manifest
        env:
          BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          swift Build/generate_update_manifest.swift             --package "$RUNNER_TEMP/dist/Blackstock.pkg"             --package-url "$BLACKSTOCK_PACKAGE_URL"             --version "${{ inputs.version }}"             --build "${{ inputs.build }}"             --source-commit-sha "${{ github.sha }}"             --output "$RUNNER_TEMP/dist/update-manifest.json"

          test -s "$RUNNER_TEMP/dist/update-manifest.json"

      - name: Validate local production artifacts
        env:
          TEAM_ID: ${{ secrets.BLACKSTOCK_APPLE_TEAM_ID }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/dist" "$BLACKSTOCK_MANIFEST_URL" "$TEAM_ID" "$SOURCE_COMMIT_SHA" "$BLACKSTOCK_PACKAGE_URL" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest_url = sys.argv[2]
          team_id = sys.argv[3]
          source_commit_sha = sys.argv[4]
          package_url = sys.argv[5]

          manifest = json.loads(
              (root / "update-manifest.json").read_text()
          )
          package = root / "Blackstock.pkg"
          digest = hashlib.sha256(package.read_bytes()).hexdigest()

          if manifest["sha256"] != digest:
              raise SystemExit("manifest SHA-256 does not match package")
          if manifest["packageURL"] != package_url:
              raise SystemExit("manifest packageURL mismatch")
          if manifest["sourceCommitSHA"] != source_commit_sha.lower():
              raise SystemExit("manifest sourceCommitSHA mismatch")

          notary = json.loads(
              (root / "notary-response.json").read_text()
          )
          if str(notary.get("status", "")).casefold() != "accepted":
              raise SystemExit("notarization is not Accepted")
          if not notary.get("id"):
              raise SystemExit("notarization submission id is missing")

          metadata = {
              "schemaVersion": 1,
              "version": manifest["version"],
              "build": manifest["build"],
              "manifestURL": manifest_url,
              "packageURL": manifest["packageURL"],
              "packageSHA256": digest,
              "installerTeamID": team_id,
              "notarySubmissionID": notary["id"],
              "notaryStatus": notary["status"],
              "sourceCommitSHA": manifest["sourceCommitSHA"],
          }
          (root / "production-build-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n"
          )
          PY

          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceCommitSHA"])' "$RUNNER_TEMP/dist/production-build-metadata.json")" = "$SOURCE_COMMIT_SHA"

          pkgutil --check-signature "$RUNNER_TEMP/dist/Blackstock.pkg"             | tee "$RUNNER_TEMP/dist/pkg-signature.txt"
          grep -q 'Developer ID Installer' "$RUNNER_TEMP/dist/pkg-signature.txt"
          grep -q "(${TEAM_ID})" "$RUNNER_TEMP/dist/pkg-signature.txt"
          xcrun stapler validate "$RUNNER_TEMP/dist/Blackstock.pkg"

      - name: Publish production GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          gh release create "$BLACKSTOCK_RELEASE_TAG" \
            "$RUNNER_TEMP/dist/Blackstock.pkg#Blackstock.pkg" \
            "$RUNNER_TEMP/dist/Blackstock.pkg.sha256#Blackstock.pkg.sha256" \
            "$RUNNER_TEMP/dist/update-manifest.json#update-manifest.json" \
            --target "$GITHUB_SHA" \
            --title "Blackstock $VERSION (Build $BUILD)" \
            --notes "Signed and notarized Blackstock production release." \
            --latest

      - name: Wait for published update endpoint
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          python3 - "$BLACKSTOCK_MANIFEST_URL" "$VERSION" "$BUILD" <<'PY'
          import json
          import sys
          import time
          import urllib.request

          url, version, build = sys.argv[1], sys.argv[2], int(sys.argv[3])
          last_error = None
          for _ in range(18):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "Blackstock-Release-Pipeline",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.load(response)
                  if (
                      str(manifest.get("version")) == version
                      and int(manifest.get("build", -1)) == build
                  ):
                      print("Published update endpoint is serving the new release.")
                      break
                  last_error = RuntimeError(
                      f"endpoint still serves {manifest.get('version')} build {manifest.get('build')}"
                  )
              except Exception as error:
                  last_error = error
              time.sleep(5)
          else:
              raise SystemExit(
                  f"published update endpoint did not converge: {last_error}"
              )
          PY
      - name: Verify published release and installed production app
        env:
          PUBLIC_KEY: ${{ secrets.BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64 }}
          TEAM_ID: ${{ secrets.BLACKSTOCK_APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.BLACKSTOCK_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.BLACKSTOCK_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          swift build -c release --product BlackstockReleaseVerifier
          BIN_DIR="$(swift build -c release --show-bin-path)"
          NOTARY_SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/dist/notary-response.json")"

          "$BIN_DIR/BlackstockReleaseVerifier" \
            --manifest-url "$BLACKSTOCK_MANIFEST_URL" \
            --public-key-base64 "$PUBLIC_KEY" \
            --installer-team-id "$TEAM_ID" \
            --current-version "$BLACKSTOCK_PREVIOUS_VERSION" \
            --current-build "$BLACKSTOCK_PREVIOUS_BUILD" \
            --notary-submission-id "$NOTARY_SUBMISSION_ID" \
            --notary-key "$BLACKSTOCK_NOTARY_KEY_PATH" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer "$NOTARY_ISSUER" \
            --verified-manifest-output "$RUNNER_TEMP/verified-update-manifest.json" \
            --verified-package-output "$RUNNER_TEMP/Blackstock-published.pkg" \
            --output "$RUNNER_TEMP/preinstall-release-evidence.json"

          sudo rm -rf /Applications/Blackstock.app
          sudo installer -pkg "$RUNNER_TEMP/Blackstock-published.pkg" -target /

          "$BIN_DIR/BlackstockReleaseVerifier" \
            --manifest-url "$BLACKSTOCK_MANIFEST_URL" \
            --public-key-base64 "$PUBLIC_KEY" \
            --installer-team-id "$TEAM_ID" \
            --current-version "$BLACKSTOCK_PREVIOUS_VERSION" \
            --current-build "$BLACKSTOCK_PREVIOUS_BUILD" \
            --verified-manifest-input "$RUNNER_TEMP/verified-update-manifest.json" \
            --verified-package-input "$RUNNER_TEMP/Blackstock-published.pkg" \
            --installed-app "/Applications/Blackstock.app" \
            --notary-submission-id "$NOTARY_SUBMISSION_ID" \
            --notary-key "$BLACKSTOCK_NOTARY_KEY_PATH" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer "$NOTARY_ISSUER" \
            --output "$RUNNER_TEMP/release-evidence.json"

          python3 Build/validate_production_release_evidence.py "$RUNNER_TEMP/release-evidence.json"

          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          LOG="$RUNNER_TEMP/production-app-launch.log"
          "$APP_BIN" >"$LOG" 2>&1 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$LOG" || true
            echo "Installed production app exited during launch smoke." >&2
            exit 1
          fi
          kill -TERM "$pid"
          wait "$pid" || true
      - name: Roll back failed published release
        if: ${{ failure() && steps.publish_release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "$BLACKSTOCK_RELEASE_TAG" --yes --cleanup-tag
      - name: Upload production release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Blackstock-production-${{ inputs.version }}-${{ inputs.build }}
          path: |
            ${{ runner.temp }}/dist/Blackstock.pkg
            ${{ runner.temp }}/dist/Blackstock.pkg.sha256
            ${{ runner.temp }}/dist/update-manifest.json
            ${{ runner.temp }}/dist/notary-response.json
            ${{ runner.temp }}/dist/production-build-metadata.json
            ${{ runner.temp }}/dist/pkg-signature.txt
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/preinstall-release-evidence.json
            ${{ runner.temp }}/verified-update-manifest.json
            ${{ runner.temp }}/production-app-launch.log
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          set +e
          rm -f             "$RUNNER_TEMP/app-cert.p12"             "$RUNNER_TEMP/installer-cert.p12"             "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${BLACKSTOCK_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$BLACKSTOCK_RELEASE_KEYCHAIN"
          fi

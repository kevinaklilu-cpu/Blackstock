name: Blackstock Canonical CI

on:
  push:
    branches: [main, master-prompt-canonical]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackstock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical source guard
        run: |
          set -euo pipefail
          grep -q '23c51e7d90ca653c92b04b19a7b65615fdf420f581caa16024725c4935bde827' docs/CANONICAL_SOURCE.md
          grep -q 'NOCH NICHT MARKTREIF' README.md
      - name: Accessibility semantic audit
        run: python3 Build/audit_accessibility.py
      - name: Security contract audit
        run: python3 Build/audit_security.py
      - name: Privacy contract audit
        run: python3 Build/audit_privacy.py
      - name: Product language audit
        run: python3 Build/audit_language.py
      - name: Temporal semantics audit
        run: python3 Build/audit_temporal.py
      - name: Grounding and provenance audit
        run: python3 Build/audit_grounding.py
      - name: Discovery audit
        run: python3 Build/audit_discovery.py
      - name: Swift tests
        run: swift test
      - name: Release build
        run: swift build -c release

  package:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build development package
        env:
          BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          chmod +x Build/package.sh
          Build/package.sh "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Blackstock.pkg"
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'Applications/Blackstock.app'
      - name: Exercise signed update manifest tooling
        run: |
          set -euo pipefail
          KEY="$(swift -e 'import CryptoKit; import Foundation; print(Curve25519.Signing.PrivateKey().rawRepresentation.base64EncodedString())')"
          export BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$KEY"
          swift Build/generate_update_manifest.swift \
            --package "$RUNNER_TEMP/dist/Blackstock.pkg" \
            --package-url "https://updates.blackstock.invalid/Blackstock.pkg" \
            --version "0.1.0" \
            --build "1" \
            --output "$RUNNER_TEMP/dist/update-manifest.json"

          test -s "$RUNNER_TEMP/dist/update-manifest.json"
          EXPECTED_SHA="$(shasum -a 256 "$RUNNER_TEMP/dist/Blackstock.pkg" | awk '{print $1}')"
          ACTUAL_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/dist/update-manifest.json")"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "0.1.0"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "1"
          test -n "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["signature"])' "$RUNNER_TEMP/dist/update-manifest.json")"

      - name: Install package on clean runner
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Blackstock.app
          sudo installer -pkg "$RUNNER_TEMP/dist/Blackstock.pkg" -target /
          test -x /Applications/Blackstock.app/Contents/MacOS/Blackstock
          plutil -lint /Applications/Blackstock.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Blackstock.app/Contents/Info.plist)" = "de.blackstock.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' /Applications/Blackstock.app/Contents/Info.plist)" = "13.0"
          codesign --verify --deep --strict --verbose=2 /Applications/Blackstock.app
      - name: Launch installed app on clean runner
        run: |
          set -euo pipefail
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          LOG="$RUNNER_TEMP/blackstock-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          pid=$!

          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Blackstock exited during the launch-stability window."
            cat "$LOG" || true
            exit 1
          fi

          kill -TERM "$pid"
          for _ in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done

          kill -KILL "$pid" 2>/dev/null || true
          echo "Blackstock required a forced stop after smoke testing."
          cat "$LOG" || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Blackstock-development-pkg
          path: |
            ${{ runner.temp }}/dist/Blackstock.pkg
            ${{ runner.temp }}/dist/Blackstock.pkg.sha256
          retention-days: 7
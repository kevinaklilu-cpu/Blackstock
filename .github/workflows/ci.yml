name: Blackstock Canonical CI

on:
  push:
    branches: [main, master-prompt-canonical]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: blackstock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pinned macOS toolchain guard
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          swift --version
      - name: Canonical source guard
        run: |
          set -euo pipefail
          grep -q '23c51e7d90ca653c92b04b19a7b65615fdf420f581caa16024725c4935bde827' docs/CANONICAL_SOURCE.md
          grep -q 'NOCH NICHT MARKTREIF' README.md
      - name: Accessibility semantic audit
        run: python3 Build/audit_accessibility.py
      - name: GitHub Actions supply-chain audit
        run: python3 Build/audit_github_actions_supply_chain.py
      - name: Security contract audit
        run: python3 Build/audit_security.py
      - name: Desktop OAuth contract audit
        run: python3 Build/audit_oauth.py
      - name: Privacy contract audit
        run: python3 Build/audit_privacy.py
      - name: Product language audit
        run: python3 Build/audit_language.py
      - name: Temporal semantics audit
        run: python3 Build/audit_temporal.py
      - name: Grounding and provenance audit
        run: python3 Build/audit_grounding.py
      - name: Discovery audit
        run: python3 Build/audit_discovery.py
      - name: Strategy audit
        run: python3 Build/audit_strategy.py
      - name: Research evidence audit
        run: python3 Build/audit_research.py
      - name: Product journey audit
        run: python3 Build/audit_journey.py
      - name: Capture foundation audit
        run: python3 Build/audit_capture.py
      - name: Capture hardware evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/capture-hardware-smoke.json"
          PROJECT_ID="00000000-0000-0000-0000-000000000101"
          RECORDING_LAUNCH_ID="00000000-0000-0000-0000-000000000201"
          PROJECT_ROOT="$HOME/Library/Application Support/Blackstock/Projects/$PROJECT_ID"
          MEDIA_DIR="$PROJECT_ROOT/Media"
          CAPTURE_DIR="$PROJECT_ROOT/Captures"
          mkdir -p "$MEDIA_DIR" "$CAPTURE_DIR"
          CAMERA="$MEDIA_DIR/00000000-0000-0000-0000-000000000401.mov"
          MICROPHONE="$CAPTURE_DIR/00000000-0000-0000-0000-000000000402.m4a"
          SCREEN="$MEDIA_DIR/00000000-0000-0000-0000-000000000403.mp4"
          printf x > "$CAMERA"
          printf x > "$MICROPHONE"
          printf x > "$SCREEN"

          cat > "$EVIDENCE" <<JSON
          {
            "schemaVersion": 5,
            "testedAt": "2026-09-19T20:00:00Z",
            "blackstockVersion": "1.0.0",
            "blackstockBuild": "100",
            "blackstockSourceCommitSHA": "1111111111111111111111111111111111111111",
            "macOSVersion": "macOS 26.6.2",
            "hardwareModel": "MacBookProTest",
            "installedFromPackage": true,
            "installerReceiptPackageID": "de.blackstock.app",
            "installerReceiptVersion": "1.0.0",
            "installerReceiptVerified": true,
            "applicationTeamID": "ABC123TEAM",
            "developerIDApplicationVerified": true,
            "applicationExecutableSHA256": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
            "camera": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.2,
              "persistedToProject": true,
              "videoTrackPresent": true,
              "projectID": "$PROJECT_ID",
              "recordedLaunchID": "$RECORDING_LAUNCH_ID",
              "persistedFilePath": "$CAMERA",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "microphone": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.1,
              "persistedToProject": true,
              "decodedSamples": 24000,
              "projectID": "$PROJECT_ID",
              "recordedLaunchID": "$RECORDING_LAUNCH_ID",
              "persistedFilePath": "$MICROPHONE",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "screen": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.4,
              "persistedToProject": true,
              "videoTrackPresent": true,
              "projectID": "$PROJECT_ID",
              "recordedLaunchID": "$RECORDING_LAUNCH_ID",
              "persistedFilePath": "$SCREEN",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "systemAudio": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.4,
              "persistedToProject": true,
              "decodedSamples": 48000,
              "projectID": "$PROJECT_ID",
              "recordedLaunchID": "$RECORDING_LAUNCH_ID",
              "persistedFilePath": "$SCREEN",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "deniedPermissionHardStopPassed": true,
            "temporaryCleanupPassed": true,
            "appRestartPersistencePassed": true,
            "restartVerifiedLaunchID": "00000000-0000-0000-0000-000000000301",
            "deniedPermissionKinds": [
              "camera",
              "microphone",
              "screen",
              "systemAudio"
            ],
            "temporaryCleanupKinds": [
              "camera",
              "microphone",
              "screen",
              "systemAudio"
            ]
          }
          JSON
          python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"
          cp "$EVIDENCE" "$RUNNER_TEMP/capture-hardware-smoke-valid.json"

          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["systemAudio"]["decodedSamples"] = 0
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Invalid capture hardware evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/capture-hardware-smoke-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["camera"]["durationSeconds"] = float("nan")
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Non-finite capture evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/capture-hardware-smoke-valid.json" "$EVIDENCE"
          OUTSIDE="$RUNNER_TEMP/00000000-0000-0000-0000-000000000499.mov"
          cp "$CAMERA" "$OUTSIDE"
          python3 - "$EVIDENCE" "$OUTSIDE" <<'PY'
          import json, sys
          path, outside = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["camera"]["persistedFilePath"] = outside
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Off-project capture evidence path was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/capture-hardware-smoke-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["microphone"]["recordedLaunchID"] = "00000000-0000-0000-0000-000000000299"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Mixed recording-launch capture evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/capture-hardware-smoke-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["microphone"]["projectID"] = "00000000-0000-0000-0000-000000000199"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Mismatched project-bound capture evidence was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Professional audio audit
        run: python3 Build/audit_audio.py
      - name: Clean-machine E2E contract audit
        run: python3 Build/audit_clean_machine.py
      - name: Production release evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/release-evidence.json"
          cat > "$EVIDENCE" <<'JSON'
          {
            "schemaVersion": 3,
            "verifiedAt": "2026-09-19T20:00:00Z",
            "manifestURL": "https://updates.blackstock.app/update-manifest.json",
            "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
            "currentVersion": "0.9.0",
            "currentBuild": 90,
            "targetVersion": "1.0.0",
            "targetBuild": 100,
            "packageSHA256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "sourceCommitSHA": "1111111111111111111111111111111111111111",
            "installerTeamID": "ABC123TEAM",
            "manifestSignatureVerified": true,
            "updateAvailabilityVerified": true,
            "packageHashVerified": true,
            "developerIDInstallerVerified": true,
            "staplerValidated": true,
            "gatekeeperInstallerAccepted": true,
            "installedAppPath": "/Applications/Blackstock.app",
            "installedAppVersion": "1.0.0",
            "installedAppBuild": 100,
            "installedAppSourceCommitSHA": "1111111111111111111111111111111111111111",
            "installedAppExecutableSHA256": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
            "cameraEntitlementVerified": true,
            "audioInputEntitlementVerified": true,
            "developerIDApplicationVerified": true,
            "gatekeeperApplicationAccepted": true,
            "notarySubmissionID": "00000000-0000-0000-0000-000000000001",
            "notaryStatus": "Accepted"
          }
          JSON
          python3 Build/validate_production_release_evidence.py "$EVIDENCE"
          cp "$EVIDENCE" "$RUNNER_TEMP/release-evidence-valid.json"

          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["packageHashVerified"] = False
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_production_release_evidence.py "$EVIDENCE"; then
            echo "Invalid release evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/release-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["manifestURL"] = "https://user:pass@updates.blackstock.app/update-manifest.json"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_production_release_evidence.py "$EVIDENCE"; then
            echo "Credential-bearing production release evidence URL was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/release-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["poison"] = float("nan")
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_production_release_evidence.py "$EVIDENCE"; then
            echo "Non-finite production release evidence was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Updater evidence audit
        run: python3 Build/audit_updater_evidence.py
      - name: In-app update evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/in-app-update-evidence.json"
          cat > "$EVIDENCE" <<'JSON'
          {
            "schemaVersion": 5,
            "value": {
              "id": "00000000-0000-0000-0000-000000000001",
              "currentVersion": "0.9.0",
              "currentBuild": 90,
              "currentSourceCommitSHA": "2222222222222222222222222222222222222222",
              "currentExecutableSHA256": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
              "currentAppPath": "/Applications/Blackstock.app",
              "currentApplicationTeamID": "ABC123TEAM",
              "currentDeveloperIDApplicationVerified": true,
              "currentInstallerReceiptPackageID": "de.blackstock.app",
              "currentInstallerReceiptVersion": "0.9.0",
              "currentInstallerReceiptVerified": true,
              "manifestURL": "https://updates.blackstock.app/update-manifest.json",
              "expectedInstallerTeamID": "ABC123TEAM",
              "startedAt": 810000000.0,
              "targetVersion": "1.0.0",
              "targetBuild": 100,
              "targetSourceCommitSHA": "1111111111111111111111111111111111111111",
              "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
              "packageSHA256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              "manifestVerifiedAt": 810000001.0,
              "packageIntegrityVerifiedAt": 810000002.0,
              "installerTeamVerifiedAt": 810000002.0,
              "installerOpenedAt": 810000003.0,
              "observedInstalledVersion": "1.0.0",
              "observedInstalledBuild": 100,
              "observedInstalledSourceCommitSHA": "1111111111111111111111111111111111111111",
              "observedInstalledExecutableSHA256": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
              "observedInstalledAppPath": "/Applications/Blackstock.app",
              "observedApplicationTeamID": "ABC123TEAM",
              "observedDeveloperIDApplicationVerified": true,
              "observedInstallerReceiptPackageID": "de.blackstock.app",
              "observedInstallerReceiptVersion": "1.0.0",
              "observedInstallerReceiptVerified": true,
              "postUpdateLaunchVerifiedAt": 810000004.0
            }
          }
          JSON
          python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"
          cp "$EVIDENCE" "$RUNNER_TEMP/in-app-update-evidence-valid.json"

          cp "$RUNNER_TEMP/in-app-update-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["currentAppPath"] = "/Users/test/Blackstock.app"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Non-production source app path was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/in-app-update-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["observedInstalledBuild"] = 99
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Invalid in-app update evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/in-app-update-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["startedAt"] = float("nan")
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Non-finite in-app update evidence was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/in-app-update-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["packageURL"] = "https://updates.blackstock.local/Blackstock.pkg"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Local-host updater evidence URL was unexpectedly accepted." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/in-app-update-evidence-valid.json" "$EVIDENCE"
          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["observedInstalledAppPath"] = "/Users/test/Blackstock.app"
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Non-production post-update app path was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Market-readiness verifier contract audit
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/market-readiness"
          mkdir -p "$ROOT"
          PROJECT_ID="00000000-0000-0000-0000-000000000101"
          RECORDING_LAUNCH_ID="00000000-0000-0000-0000-000000000201"
          PROJECT_ROOT="$HOME/Library/Application Support/Blackstock/Projects/$PROJECT_ID"
          MEDIA_DIR="$PROJECT_ROOT/Media"
          CAPTURE_DIR="$PROJECT_ROOT/Captures"
          mkdir -p "$MEDIA_DIR" "$CAPTURE_DIR"
          CAMERA="$MEDIA_DIR/00000000-0000-0000-0000-000000000401.mov"
          MICROPHONE="$CAPTURE_DIR/00000000-0000-0000-0000-000000000402.m4a"
          SCREEN="$MEDIA_DIR/00000000-0000-0000-0000-000000000403.mp4"
          printf x > "$CAMERA"
          printf x > "$MICROPHONE"
          printf x > "$SCREEN"
          HASH="$(shasum -a 256 "$CAMERA" | awk '{print $1}')"

          python3 - "$ROOT" "$HASH" "$CAMERA" "$MICROPHONE" "$SCREEN" "$PROJECT_ID" "$RECORDING_LAUNCH_ID" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          capture_hash = sys.argv[2]
          camera_path = pathlib.Path(sys.argv[3])
          microphone_path = pathlib.Path(sys.argv[4])
          screen_path = pathlib.Path(sys.argv[5])
          project_id = sys.argv[6]
          recording_launch_id = sys.argv[7]
          package_hash = "a" * 64
          executable_hash = "c" * 64
          source_commit = "1" * 40

          capture = {
              "schemaVersion": 5,
              "testedAt": "2026-09-19T20:00:00Z",
              "blackstockVersion": "1.0.0",
              "blackstockBuild": "100",
              "blackstockSourceCommitSHA": source_commit,
              "macOSVersion": "macOS 26.6.2",
              "hardwareModel": "MacBookProTest",
              "installedFromPackage": True,
              "installerReceiptPackageID": "de.blackstock.app",
              "installerReceiptVersion": "1.0.0",
              "installerReceiptVerified": True,
              "applicationTeamID": "ABC123TEAM",
              "developerIDApplicationVerified": True,
              "applicationExecutableSHA256": executable_hash,
              "camera": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.2,
                  "persistedToProject": True,
                  "videoTrackPresent": True,
                  "projectID": project_id,
                  "recordedLaunchID": recording_launch_id,
                  "persistedFilePath": str(camera_path),
                  "persistedFileSHA256": capture_hash,
              },
              "microphone": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.1,
                  "persistedToProject": True,
                  "decodedSamples": 24000,
                  "projectID": project_id,
                  "recordedLaunchID": recording_launch_id,
                  "persistedFilePath": str(microphone_path),
                  "persistedFileSHA256": capture_hash,
              },
              "screen": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.4,
                  "persistedToProject": True,
                  "videoTrackPresent": True,
                  "projectID": project_id,
                  "recordedLaunchID": recording_launch_id,
                  "persistedFilePath": str(screen_path),
                  "persistedFileSHA256": capture_hash,
              },
              "systemAudio": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.4,
                  "persistedToProject": True,
                  "decodedSamples": 48000,
                  "projectID": project_id,
                  "recordedLaunchID": recording_launch_id,
                  "persistedFilePath": str(screen_path),
                  "persistedFileSHA256": capture_hash,
              },
              "deniedPermissionHardStopPassed": True,
              "temporaryCleanupPassed": True,
              "appRestartPersistencePassed": True,
              "restartVerifiedLaunchID": "00000000-0000-0000-0000-000000000301",
              "deniedPermissionKinds": [
                  "camera", "microphone", "screen", "systemAudio"
              ],
              "temporaryCleanupKinds": [
                  "camera", "microphone", "screen", "systemAudio"
              ],
          }

          release = {
              "schemaVersion": 3,
              "verifiedAt": "2026-09-19T20:00:00Z",
              "manifestURL": "https://updates.blackstock.app/update-manifest.json",
              "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
              "currentVersion": "0.9.0",
              "currentBuild": 90,
              "targetVersion": "1.0.0",
              "targetBuild": 100,
              "packageSHA256": package_hash,
              "sourceCommitSHA": source_commit,
              "installerTeamID": "ABC123TEAM",
              "manifestSignatureVerified": True,
              "updateAvailabilityVerified": True,
              "packageHashVerified": True,
              "developerIDInstallerVerified": True,
              "staplerValidated": True,
              "gatekeeperInstallerAccepted": True,
              "installedAppPath": "/Applications/Blackstock.app",
              "installedAppVersion": "1.0.0",
              "installedAppBuild": 100,
              "installedAppSourceCommitSHA": source_commit,
              "installedAppExecutableSHA256": executable_hash,
              "cameraEntitlementVerified": True,
              "audioInputEntitlementVerified": True,
              "developerIDApplicationVerified": True,
              "gatekeeperApplicationAccepted": True,
              "notarySubmissionID": "00000000-0000-0000-0000-000000000001",
              "notaryStatus": "Accepted",
          }

          updater = {
              "schemaVersion": 5,
              "value": {
                  "id": "00000000-0000-0000-0000-000000000001",
                  "currentVersion": "0.9.0",
                  "currentBuild": 90,
                  "currentSourceCommitSHA": "2" * 40,
                  "currentExecutableSHA256": "b" * 64,
                  "currentAppPath": "/Applications/Blackstock.app",
                  "currentApplicationTeamID": "ABC123TEAM",
                  "currentDeveloperIDApplicationVerified": True,
                  "currentInstallerReceiptPackageID": "de.blackstock.app",
                  "currentInstallerReceiptVersion": "0.9.0",
                  "currentInstallerReceiptVerified": True,
                  "manifestURL": "https://updates.blackstock.app/update-manifest.json",
                  "expectedInstallerTeamID": "ABC123TEAM",
                  "startedAt": 810000000.0,
                  "targetVersion": "1.0.0",
                  "targetBuild": 100,
                  "targetSourceCommitSHA": source_commit,
                  "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
                  "packageSHA256": package_hash,
                  "manifestVerifiedAt": 810000001.0,
                  "packageIntegrityVerifiedAt": 810000002.0,
                  "installerTeamVerifiedAt": 810000002.0,
                  "installerOpenedAt": 810000003.0,
                  "observedInstalledVersion": "1.0.0",
                  "observedInstalledBuild": 100,
                  "observedInstalledSourceCommitSHA": source_commit,
                  "observedInstalledExecutableSHA256": executable_hash,
                  "observedInstalledAppPath": "/Applications/Blackstock.app",
                  "observedApplicationTeamID": "ABC123TEAM",
                  "observedDeveloperIDApplicationVerified": True,
                  "observedInstallerReceiptPackageID": "de.blackstock.app",
                  "observedInstallerReceiptVersion": "1.0.0",
                  "observedInstallerReceiptVerified": True,
                  "postUpdateLaunchVerifiedAt": 810000004.0,
              },
          }

          (root / "capture.json").write_text(json.dumps(capture))
          (root / "release.json").write_text(json.dumps(release))
          (root / "updater.json").write_text(json.dumps(updater))
          PY

          python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json" \
            --output "$ROOT/market-readiness.json"
          grep -q '"ready": true' "$ROOT/market-readiness.json"
          grep -q '"schemaVersion": 3' "$ROOT/market-readiness.json"
          grep -q '"sourceAppPath": "/Applications/Blackstock.app"' "$ROOT/market-readiness.json"
          grep -q '"installedAppPath": "/Applications/Blackstock.app"' "$ROOT/market-readiness.json"
          grep -q '"sourceInstallerReceiptVersion": "0.9.0"' "$ROOT/market-readiness.json"
          grep -q '"installerReceiptVersion": "1.0.0"' "$ROOT/market-readiness.json"

          python3 - "$ROOT/capture.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["applicationTeamID"] = "OTHERTEAM"
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Cross-team capture mismatch was unexpectedly accepted." >&2
            exit 1
          fi

          python3 - "$ROOT/capture.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["applicationTeamID"] = "ABC123TEAM"
          json.dump(data, open(path, "w"))
          PY

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["packageSHA256"] = "b" * 64
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Cross-release mismatch was unexpectedly accepted." >&2
            exit 1
          fi

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["packageSHA256"] = "a" * 64
          data["value"]["observedInstalledSourceCommitSHA"] = "2" * 40
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Source-commit mismatch was unexpectedly accepted." >&2
            exit 1
          fi

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["observedInstalledSourceCommitSHA"] = "1" * 40
          data["value"]["observedInstalledExecutableSHA256"] = "d" * 64
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Executable mismatch was unexpectedly accepted." >&2
            exit 1
          fi

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["observedInstalledExecutableSHA256"] = "c" * 64
          data["value"]["currentBuild"] = 89
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Source update build mismatch was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Update signing key-pair audit
        run: |
          set -euo pipefail
          PRIVATE="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(1, 33))).decode())')"
          PUBLIC="$(BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$PRIVATE" swift -e 'import CryptoKit; import Foundation; let raw = Data(base64Encoded: ProcessInfo.processInfo.environment["BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64"]!)!; let key = try! Curve25519.Signing.PrivateKey(rawRepresentation: raw); print(key.publicKey.rawRepresentation.base64EncodedString())')"

          BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$PRIVATE" \
          BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64="$PUBLIC" \
            swift Build/verify_update_key_pair.swift

          OTHER_PRIVATE="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(33, 65))).decode())')"
          if BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$OTHER_PRIVATE" \
             BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64="$PUBLIC" \
             swift Build/verify_update_key_pair.swift; then
            echo "Mismatched update signing keys were unexpectedly accepted." >&2
            exit 1
          fi

      - name: Production release workflow audit
        run: python3 Build/audit_production_release_workflows.py
      - name: Release verifier immutable snapshot and URL audit
        run: |
          set -euo pipefail
          swift build -c release --product BlackstockReleaseVerifier
          BIN_DIR="$(swift build -c release --show-bin-path)"
          VERIFIER="$BIN_DIR/BlackstockReleaseVerifier"

          COMMON_ARGS=(
            --manifest-url "https://updates.blackstock.app/update-manifest.json"
            --public-key-base64 "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
            --installer-team-id "ABC123TEAM"
            --current-version "0.9.0"
            --current-build "90"
          )

          if "$VERIFIER" \
            "${COMMON_ARGS[@]}" \
            --verified-manifest-input "$RUNNER_TEMP/manifest.json"; then
            echo "Release verifier unexpectedly accepted a manifest snapshot without its paired package." >&2
            exit 1
          fi

          if "$VERIFIER" \
            "${COMMON_ARGS[@]}" \
            --verified-package-input "$RUNNER_TEMP/Blackstock.pkg"; then
            echo "Release verifier unexpectedly accepted a package snapshot without its paired manifest." >&2
            exit 1
          fi

          for BAD_URL in \
            "http://updates.blackstock.app/update-manifest.json" \
            "https://localhost./update-manifest.json" \
            "https://[::1]/update-manifest.json" \
            "https://updates.blackstock.local/update-manifest.json" \
            "https://user:pass@updates.blackstock.app/update-manifest.json" \
            "https://updates.blackstock.app/update-manifest.json#fragment"
          do
            if "$VERIFIER" \
              --manifest-url "$BAD_URL" \
              --public-key-base64 "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
              --installer-team-id "ABC123TEAM" \
              --current-version "0.9.0" \
              --current-build "90" \
              --verified-manifest-input "$RUNNER_TEMP/manifest.json" \
              --verified-package-input "$RUNNER_TEMP/Blackstock.pkg"; then
              echo "Release verifier unexpectedly accepted invalid production manifest URL: $BAD_URL" >&2
              exit 1
            fi
          done
      - name: Production package configuration audit
        run: |
          set -euo pipefail
          KEY="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(32))).decode())')"

          python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$KEY" \
            --installer-team-id "ABC123TEAM"

          for BAD_URL in \
            "http://updates.blackstock.app/update-manifest.json" \
            "https://localhost/update-manifest.json" \
            "https://localhost./update-manifest.json" \
            "https://[::1]/update-manifest.json" \
            "https://updates.blackstock.local/update-manifest.json" \
            "https://updates.blackstock.invalid" \
            "https://user:pass@updates.blackstock.app/update-manifest.json" \
            "https://updates.blackstock.app/update-manifest.json#fragment"
          do
            if python3 Build/validate_production_package_config.py \
              --manifest-url "$BAD_URL" \
              --public-key-base64 "$KEY" \
              --installer-team-id "ABC123TEAM"; then
              echo "Invalid production manifest URL was unexpectedly accepted: $BAD_URL" >&2
              exit 1
            fi
          done

          BAD_KEY="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(31))).decode())')"
          if python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$BAD_KEY" \
            --installer-team-id "ABC123TEAM"; then
            echo "Invalid production update public key was unexpectedly accepted." >&2
            exit 1
          fi

          if python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$KEY" \
            --installer-team-id "ABC-123"; then
            echo "Invalid production installer Team ID was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Production package fail-closed audit
        run: |
          set -euo pipefail

          if BLACKSTOCK_PRODUCTION_RELEASE=1 \
            BLACKSTOCK_INCLUDE_E2E_SMOKE=1 \
            bash Build/package.sh "$RUNNER_TEMP/forbidden-production-e2e"; then
            echo "Production package unexpectedly allowed the CI-only E2E helper." >&2
            exit 1
          fi

          if BLACKSTOCK_PRODUCTION_RELEASE=1 \
            BLACKSTOCK_INCLUDE_E2E_SMOKE=0 \
            bash Build/package.sh "$RUNNER_TEMP/incomplete-production"; then
            echo "Production package unexpectedly accepted missing release configuration." >&2
            exit 1
          fi
      - name: Signed update manifest production URL audit
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/url-audit.pkg"
          OUTPUT="$RUNNER_TEMP/url-audit-manifest.json"
          printf x > "$PACKAGE"
          PRIVATE="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(1, 33))).decode())')"

          for BAD_URL in \
            "http://updates.blackstock.app/Blackstock.pkg" \
            "https://localhost./Blackstock.pkg" \
            "https://[::1]/Blackstock.pkg" \
            "https://updates.blackstock.local/Blackstock.pkg" \
            "https://updates.blackstock.invalid/Blackstock.pkg" \
            "https://user:pass@updates.blackstock.app/Blackstock.pkg" \
            "https://updates.blackstock.app/Blackstock.pkg#fragment"
          do
            if BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$PRIVATE" \
              swift Build/generate_update_manifest.swift \
                --package "$PACKAGE" \
                --package-url "$BAD_URL" \
                --version "1.0.0" \
                --build "100" \
                --source-commit-sha "1111111111111111111111111111111111111111" \
                --output "$OUTPUT"; then
              echo "Signed manifest generator unexpectedly accepted invalid production package URL: $BAD_URL" >&2
              exit 1
            fi
          done
      - name: Swift tests
        run: swift test
      - name: Release build
        run: swift build -c release

  package:
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pinned macOS toolchain guard
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          swift --version
      - name: Build development package
        env:
          BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
          BLACKSTOCK_SOURCE_COMMIT_SHA: ${{ github.sha }}
          BLACKSTOCK_INCLUDE_E2E_SMOKE: "1"
        run: |
          chmod +x Build/package.sh
          Build/package.sh "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Blackstock.pkg"
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'Applications/Blackstock.app'
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke'
          if pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'BlackstockReleaseVerifier'; then
            echo "Developer release verifier must not ship in Blackstock.pkg." >&2
            exit 1
          fi
      - name: Exercise signed update manifest tooling
        run: |
          set -euo pipefail
          KEY="$(swift -e 'import CryptoKit; import Foundation; print(Curve25519.Signing.PrivateKey().rawRepresentation.base64EncodedString())')"
          export BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$KEY"
          swift Build/generate_update_manifest.swift \
            --package "$RUNNER_TEMP/dist/Blackstock.pkg" \
            --package-url "https://updates.blackstock.app/Blackstock.pkg" \
            --version "0.1.0" \
            --build "1" \
            --source-commit-sha "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/dist/update-manifest.json"

          test -s "$RUNNER_TEMP/dist/update-manifest.json"
          EXPECTED_SHA="$(shasum -a 256 "$RUNNER_TEMP/dist/Blackstock.pkg" | awk '{print $1}')"
          ACTUAL_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/dist/update-manifest.json")"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "0.1.0"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "1"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceCommitSHA"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "$GITHUB_SHA"
          test -n "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["signature"])' "$RUNNER_TEMP/dist/update-manifest.json")"

      - name: Install package on clean runner
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Blackstock.app
          sudo installer -pkg "$RUNNER_TEMP/dist/Blackstock.pkg" -target /
          test -x /Applications/Blackstock.app/Contents/MacOS/Blackstock
          test -x /Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke
          lipo -verify_arch arm64 x86_64 /Applications/Blackstock.app/Contents/MacOS/Blackstock
          lipo -verify_arch arm64 x86_64 /Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke
          plutil -lint /Applications/Blackstock.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Blackstock.app/Contents/Info.plist)" = "de.blackstock.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BlackstockSourceCommitSHA' /Applications/Blackstock.app/Contents/Info.plist)" = "${GITHUB_SHA}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' /Applications/Blackstock.app/Contents/Info.plist)" = "13.0"

          RECEIPT="$RUNNER_TEMP/blackstock-installer-receipt.plist"
          pkgutil --pkg-info-plist de.blackstock.app > "$RECEIPT"
          python3 - "$RECEIPT" /Applications/Blackstock.app/Contents/Info.plist <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              receipt = plistlib.load(handle)
          with open(sys.argv[2], "rb") as handle:
              info = plistlib.load(handle)

          assert receipt["pkgid"] == "de.blackstock.app"
          assert receipt["pkg-version"] == info["CFBundleShortVersionString"]
          assert receipt["volume"] == "/"
          assert receipt["install-location"] == "/"
          PY

          codesign --verify --deep --strict --verbose=2 /Applications/Blackstock.app
          codesign --display --verbose=4 /Applications/Blackstock.app 2>&1 \
            | grep -qi 'runtime'

          ENTITLEMENTS="$RUNNER_TEMP/blackstock-entitlements.txt"
          codesign --display --entitlements :- /Applications/Blackstock.app \
            >"$ENTITLEMENTS" 2>&1
          python3 - "$ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          start = text.find("<?xml")
          end = text.rfind("</plist>")
          if start < 0 or end < 0:
              raise SystemExit("codesign did not emit a readable entitlements plist")
          payload = text[start:end + len("</plist>")].encode()
          values = plistlib.loads(payload)
          assert values.get("com.apple.security.device.camera") is True
          assert values.get("com.apple.security.device.audio-input") is True
          PY

          APP_INFO="/Applications/Blackstock.app/Contents/Info.plist"
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          python3 - "$APP_INFO" "$RECEIPT" "$APP_BIN" "$RUNNER_TEMP/dist/Blackstock.pkg" "$RUNNER_TEMP/dist/installed-release-fingerprint.json" <<'PY'
          import hashlib
          import json
          import plistlib
          import pathlib
          import platform
          import sys

          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)
          with open(sys.argv[2], "rb") as handle:
              receipt = plistlib.load(handle)

          executable = pathlib.Path(sys.argv[3])
          package = pathlib.Path(sys.argv[4])
          fingerprint = {
              "schemaVersion": 1,
              "runnerArchitecture": platform.machine(),
              "bundleIdentifier": info["CFBundleIdentifier"],
              "version": info["CFBundleShortVersionString"],
              "build": info["CFBundleVersion"],
              "sourceCommitSHA": info["BlackstockSourceCommitSHA"].lower(),
              "packageSHA256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "executableSHA256": hashlib.sha256(executable.read_bytes()).hexdigest(),
              "installerReceiptPackageID": receipt["pkgid"],
              "installerReceiptVersion": receipt["pkg-version"],
              "installerReceiptVolume": receipt["volume"],
              "installerReceiptInstallLocation": receipt["install-location"],
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(fingerprint, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Launch installed app on clean runner
        run: |
          set -euo pipefail
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          LOG="$RUNNER_TEMP/blackstock-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          pid=$!

          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Blackstock exited during the launch-stability window."
            cat "$LOG" || true
            exit 1
          fi

          kill -TERM "$pid"
          for _ in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done

          kill -KILL "$pid" 2>/dev/null || true
          echo "Blackstock required a forced stop after smoke testing."
          cat "$LOG" || true
          exit 1

      - name: Run installed creator-loop E2E
        run: |
          set -euo pipefail
          E2E_BIN="/Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke"
          RESULT="$RUNNER_TEMP/blackstock-clean-machine-e2e.json"
          LOG="$RUNNER_TEMP/blackstock-clean-machine-e2e.log"

          "$E2E_BIN" --output "$RESULT" | tee "$LOG"
          grep -q 'BLACKSTOCK_E2E_PASS' "$LOG"
          test -s "$RESULT"

          python3 - "$RESULT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["generatedSource"] is True
          assert data["rendered"] is True
          assert data["renderValidated"] is True
          assert data["audioTrackValidated"] is True
          assert data["pcmSamplesAnalyzed"] > 0
          assert isinstance(data["integratedLUFS"], (int, float))
          assert isinstance(data["truePeakDBTP"], (int, float))
          assert data["qualityReviewPassed"] is True
          assert data["uploadVideoID"] == "e2e-video-123"
          assert data["uploadJournalCommitted"] is True
          assert data["analyticsViews"] == 1234
          assert data["learningFactCount"] > 0
          assert data["persistenceRoundTrip"] is True
          PY

      - name: Upload Intel release identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Blackstock-intel-release-identity
          path: |
            ${{ runner.temp }}/intel-installed-release-fingerprint.json
            ${{ runner.temp }}/blackstock-intel-clean-machine-e2e.json
            ${{ runner.temp }}/blackstock-intel-clean-machine-e2e.log
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Blackstock-development-pkg
          path: |
            ${{ runner.temp }}/dist/Blackstock.pkg
            ${{ runner.temp }}/dist/Blackstock.pkg.sha256
            ${{ runner.temp }}/dist/installed-release-fingerprint.json
          retention-days: 7

  intel-smoke:
    runs-on: macos-26-intel
    needs: package
    steps:
      - name: Pinned macOS toolchain guard
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          swift --version
          test "$(uname -m)" = "x86_64"

      - name: Download exact packaged build
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: Blackstock-development-pkg
          path: ${{ runner.temp }}/intel-package

      - name: Verify downloaded package identity
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/intel-package"
          test -s Blackstock.pkg
          test -s Blackstock.pkg.sha256
          test -s installed-release-fingerprint.json
          EXPECTED_SHA="$(awk '{print $1}' Blackstock.pkg.sha256)"
          ACTUAL_SHA="$(shasum -a 256 Blackstock.pkg | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          pkgutil --payload-files Blackstock.pkg | grep -q 'Applications/Blackstock.app'
          pkgutil --payload-files Blackstock.pkg | grep -q 'Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke'

      - name: Install exact package on native Intel runner
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Blackstock.app
          sudo installer -pkg "$RUNNER_TEMP/intel-package/Blackstock.pkg" -target /
          test -x /Applications/Blackstock.app/Contents/MacOS/Blackstock
          test -x /Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke
          lipo -verify_arch arm64 x86_64 /Applications/Blackstock.app/Contents/MacOS/Blackstock
          lipo -verify_arch arm64 x86_64 /Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke
          test "$(/usr/libexec/PlistBuddy -c 'Print :BlackstockSourceCommitSHA' /Applications/Blackstock.app/Contents/Info.plist)" = "${GITHUB_SHA}"
          codesign --verify --deep --strict --verbose=2 /Applications/Blackstock.app

          RECEIPT="$RUNNER_TEMP/intel-installer-receipt.plist"
          pkgutil --pkg-info-plist de.blackstock.app > "$RECEIPT"
          APP_INFO="/Applications/Blackstock.app/Contents/Info.plist"
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          INTEL_FINGERPRINT="$RUNNER_TEMP/intel-installed-release-fingerprint.json"

          python3 - "$APP_INFO" "$RECEIPT" "$APP_BIN" "$RUNNER_TEMP/intel-package/Blackstock.pkg" "$INTEL_FINGERPRINT" <<'PY'
          import hashlib
          import json
          import plistlib
          import pathlib
          import platform
          import sys

          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)
          with open(sys.argv[2], "rb") as handle:
              receipt = plistlib.load(handle)

          executable = pathlib.Path(sys.argv[3])
          package = pathlib.Path(sys.argv[4])
          fingerprint = {
              "schemaVersion": 1,
              "runnerArchitecture": platform.machine(),
              "bundleIdentifier": info["CFBundleIdentifier"],
              "version": info["CFBundleShortVersionString"],
              "build": info["CFBundleVersion"],
              "sourceCommitSHA": info["BlackstockSourceCommitSHA"].lower(),
              "packageSHA256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "executableSHA256": hashlib.sha256(executable.read_bytes()).hexdigest(),
              "installerReceiptPackageID": receipt["pkgid"],
              "installerReceiptVersion": receipt["pkg-version"],
              "installerReceiptVolume": receipt["volume"],
              "installerReceiptInstallLocation": receipt["install-location"],
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(fingerprint, indent=2, sort_keys=True) + "\n"
          )
          PY

          python3 - "$RUNNER_TEMP/intel-package/installed-release-fingerprint.json" "$INTEL_FINGERPRINT" <<'PY'
          import json
          import pathlib
          import sys

          apple = json.loads(pathlib.Path(sys.argv[1]).read_text())
          intel = json.loads(pathlib.Path(sys.argv[2]).read_text())

          if apple.get("runnerArchitecture") != "arm64":
              raise SystemExit("Apple-Silicon fingerprint did not originate from arm64")
          if intel.get("runnerArchitecture") != "x86_64":
              raise SystemExit("Intel fingerprint did not originate from x86_64")

          package_path = pathlib.Path(
              "$RUNNER_TEMP/intel-package/Blackstock.pkg"
          )
          downloaded_package_sha = __import__("hashlib").sha256(
              package_path.read_bytes()
          ).hexdigest()
          if apple.get("packageSHA256") != downloaded_package_sha:
              raise SystemExit(
                  "Apple-Silicon fingerprint is not bound to the downloaded package"
              )
          if intel.get("packageSHA256") != downloaded_package_sha:
              raise SystemExit(
                  "Intel fingerprint is not bound to the downloaded package"
              )

          identity_fields = [
              "schemaVersion",
              "bundleIdentifier",
              "version",
              "build",
              "sourceCommitSHA",
              "packageSHA256",
              "executableSHA256",
              "installerReceiptPackageID",
              "installerReceiptVersion",
              "installerReceiptVolume",
              "installerReceiptInstallLocation",
          ]
          mismatches = [
              key for key in identity_fields
              if apple.get(key) != intel.get(key)
          ]
          if mismatches:
              raise SystemExit(
                  "Cross-architecture installed release identity mismatch: "
                  + ", ".join(mismatches)
              )
          PY

      - name: Launch installed app natively on Intel
        run: |
          set -euo pipefail
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          LOG="$RUNNER_TEMP/blackstock-intel-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          pid=$!
          sleep 3

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Blackstock exited during the native Intel launch-stability window." >&2
            cat "$LOG" || true
            exit 1
          fi

          kill -TERM "$pid"
          for _ in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done

          kill -KILL "$pid" 2>/dev/null || true
          echo "Blackstock required a forced stop during native Intel smoke." >&2
          cat "$LOG" || true
          exit 1

      - name: Run installed creator-loop E2E natively on Intel
        run: |
          set -euo pipefail
          E2E_BIN="/Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke"
          RESULT="$RUNNER_TEMP/blackstock-intel-clean-machine-e2e.json"
          LOG="$RUNNER_TEMP/blackstock-intel-clean-machine-e2e.log"

          "$E2E_BIN" --output "$RESULT" | tee "$LOG"
          grep -q 'BLACKSTOCK_E2E_PASS' "$LOG"
          test -s "$RESULT"

          python3 - "$RESULT" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          assert data["generatedSource"] is True
          assert data["rendered"] is True
          assert data["renderValidated"] is True
          assert data["audioTrackValidated"] is True
          assert data["pcmSamplesAnalyzed"] > 0
          assert isinstance(data["integratedLUFS"], (int, float))
          assert isinstance(data["truePeakDBTP"], (int, float))
          assert data["qualityReviewPassed"] is True
          assert data["uploadVideoID"] == "e2e-video-123"
          assert data["uploadJournalCommitted"] is True
          assert data["analyticsViews"] == 1234
          assert data["learningFactCount"] > 0
          assert data["persistenceRoundTrip"] is True
          PY


name: Blackstock Canonical CI

on:
  push:
    branches: [main, master-prompt-canonical]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackstock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical source guard
        run: |
          set -euo pipefail
          grep -q '23c51e7d90ca653c92b04b19a7b65615fdf420f581caa16024725c4935bde827' docs/CANONICAL_SOURCE.md
          grep -q 'NOCH NICHT MARKTREIF' README.md
      - name: Accessibility semantic audit
        run: python3 Build/audit_accessibility.py
      - name: Security contract audit
        run: python3 Build/audit_security.py
      - name: Desktop OAuth contract audit
        run: python3 Build/audit_oauth.py
      - name: Privacy contract audit
        run: python3 Build/audit_privacy.py
      - name: Product language audit
        run: python3 Build/audit_language.py
      - name: Temporal semantics audit
        run: python3 Build/audit_temporal.py
      - name: Grounding and provenance audit
        run: python3 Build/audit_grounding.py
      - name: Discovery audit
        run: python3 Build/audit_discovery.py
      - name: Strategy audit
        run: python3 Build/audit_strategy.py
      - name: Research evidence audit
        run: python3 Build/audit_research.py
      - name: Product journey audit
        run: python3 Build/audit_journey.py
      - name: Capture foundation audit
        run: python3 Build/audit_capture.py
      - name: Capture hardware evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/capture-hardware-smoke.json"
          CAMERA="$RUNNER_TEMP/camera.mov"
          MICROPHONE="$RUNNER_TEMP/microphone.m4a"
          SCREEN="$RUNNER_TEMP/screen.mp4"
          printf x > "$CAMERA"
          printf x > "$MICROPHONE"
          printf x > "$SCREEN"

          cat > "$EVIDENCE" <<JSON
          {
            "schemaVersion": 2,
            "testedAt": "2026-09-19T20:00:00Z",
            "blackstockVersion": "1.0.0",
            "blackstockBuild": "100",
            "blackstockSourceCommitSHA": "1111111111111111111111111111111111111111",
            "macOSVersion": "macOS 26.6.2",
            "hardwareModel": "MacBookProTest",
            "installedFromPackage": true,
            "camera": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.2,
              "persistedToProject": true,
              "videoTrackPresent": true,
              "projectID": "00000000-0000-0000-0000-000000000101",
              "recordedLaunchID": "00000000-0000-0000-0000-000000000201",
              "persistedFilePath": "$CAMERA",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "microphone": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.1,
              "persistedToProject": true,
              "decodedSamples": 24000,
              "projectID": "00000000-0000-0000-0000-000000000102",
              "recordedLaunchID": "00000000-0000-0000-0000-000000000202",
              "persistedFilePath": "$MICROPHONE",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "screen": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.4,
              "persistedToProject": true,
              "videoTrackPresent": true,
              "projectID": "00000000-0000-0000-0000-000000000103",
              "recordedLaunchID": "00000000-0000-0000-0000-000000000203",
              "persistedFilePath": "$SCREEN",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "systemAudio": {
              "permissionGranted": true,
              "recordingCreated": true,
              "durationSeconds": 5.4,
              "persistedToProject": true,
              "decodedSamples": 48000,
              "projectID": "00000000-0000-0000-0000-000000000103",
              "recordedLaunchID": "00000000-0000-0000-0000-000000000203",
              "persistedFilePath": "$SCREEN",
              "persistedFileSHA256": "2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881"
            },
            "deniedPermissionHardStopPassed": true,
            "temporaryCleanupPassed": true,
            "appRestartPersistencePassed": true,
            "restartVerifiedLaunchID": "00000000-0000-0000-0000-000000000301",
            "deniedPermissionKinds": [
              "camera",
              "microphone",
              "screen",
              "systemAudio"
            ],
            "temporaryCleanupKinds": [
              "camera",
              "microphone",
              "screen",
              "systemAudio"
            ]
          }
          JSON
          python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"

          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["systemAudio"]["decodedSamples"] = 0
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_capture_hardware_smoke.py "$EVIDENCE"; then
            echo "Invalid capture hardware evidence was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Professional audio audit
        run: python3 Build/audit_audio.py
      - name: Clean-machine E2E contract audit
        run: python3 Build/audit_clean_machine.py
      - name: Production release evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/release-evidence.json"
          cat > "$EVIDENCE" <<'JSON'
          {
            "schemaVersion": 2,
            "verifiedAt": "2026-09-19T20:00:00Z",
            "manifestURL": "https://updates.blackstock.app/update-manifest.json",
            "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
            "currentVersion": "0.9.0",
            "currentBuild": 90,
            "targetVersion": "1.0.0",
            "targetBuild": 100,
            "packageSHA256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "sourceCommitSHA": "1111111111111111111111111111111111111111",
            "installerTeamID": "ABC123TEAM",
            "manifestSignatureVerified": true,
            "updateAvailabilityVerified": true,
            "packageHashVerified": true,
            "developerIDInstallerVerified": true,
            "staplerValidated": true,
            "gatekeeperInstallerAccepted": true,
            "installedAppPath": "/Applications/Blackstock.app",
            "installedAppVersion": "1.0.0",
            "installedAppBuild": 100,
            "installedAppSourceCommitSHA": "1111111111111111111111111111111111111111",
            "cameraEntitlementVerified": true,
            "audioInputEntitlementVerified": true,
            "developerIDApplicationVerified": true,
            "gatekeeperApplicationAccepted": true,
            "notarySubmissionID": "00000000-0000-0000-0000-000000000001",
            "notaryStatus": "Accepted"
          }
          JSON
          python3 Build/validate_production_release_evidence.py "$EVIDENCE"

          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["packageHashVerified"] = False
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_production_release_evidence.py "$EVIDENCE"; then
            echo "Invalid release evidence was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Updater evidence audit
        run: python3 Build/audit_updater_evidence.py
      - name: In-app update evidence validator audit
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/in-app-update-evidence.json"
          cat > "$EVIDENCE" <<'JSON'
          {
            "schemaVersion": 2,
            "value": {
              "id": "00000000-0000-0000-0000-000000000001",
              "currentVersion": "0.9.0",
              "currentBuild": 90,
              "manifestURL": "https://updates.blackstock.app/update-manifest.json",
              "expectedInstallerTeamID": "ABC123TEAM",
              "startedAt": 810000000.0,
              "targetVersion": "1.0.0",
              "targetBuild": 100,
              "targetSourceCommitSHA": "1111111111111111111111111111111111111111",
              "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
              "packageSHA256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              "manifestVerifiedAt": 810000001.0,
              "packageIntegrityVerifiedAt": 810000002.0,
              "installerTeamVerifiedAt": 810000002.0,
              "installerOpenedAt": 810000003.0,
              "observedInstalledVersion": "1.0.0",
              "observedInstalledBuild": 100,
              "observedInstalledSourceCommitSHA": "1111111111111111111111111111111111111111",
              "postUpdateLaunchVerifiedAt": 810000004.0
            }
          }
          JSON
          python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"

          python3 - "$EVIDENCE" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["observedInstalledBuild"] = 99
          json.dump(data, open(path, "w"))
          PY
          if python3 Build/validate_in_app_update_evidence.py "$EVIDENCE"; then
            echo "Invalid in-app update evidence was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Market-readiness verifier contract audit
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/market-readiness"
          mkdir -p "$ROOT"
          CAMERA="$ROOT/camera.mov"
          MICROPHONE="$ROOT/microphone.m4a"
          SCREEN="$ROOT/screen.mp4"
          printf x > "$CAMERA"
          printf x > "$MICROPHONE"
          printf x > "$SCREEN"
          HASH="$(shasum -a 256 "$CAMERA" | awk '{print $1}')"

          python3 - "$ROOT" "$HASH" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          capture_hash = sys.argv[2]
          package_hash = "a" * 64
          source_commit = "1" * 40

          capture = {
              "schemaVersion": 2,
              "testedAt": "2026-09-19T20:00:00Z",
              "blackstockVersion": "1.0.0",
              "blackstockBuild": "100",
              "blackstockSourceCommitSHA": source_commit,
              "macOSVersion": "macOS 26.6.2",
              "hardwareModel": "MacBookProTest",
              "installedFromPackage": True,
              "camera": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.2,
                  "persistedToProject": True,
                  "videoTrackPresent": True,
                  "projectID": "00000000-0000-0000-0000-000000000101",
                  "recordedLaunchID": "00000000-0000-0000-0000-000000000201",
                  "persistedFilePath": str(root / "camera.mov"),
                  "persistedFileSHA256": capture_hash,
              },
              "microphone": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.1,
                  "persistedToProject": True,
                  "decodedSamples": 24000,
                  "projectID": "00000000-0000-0000-0000-000000000102",
                  "recordedLaunchID": "00000000-0000-0000-0000-000000000202",
                  "persistedFilePath": str(root / "microphone.m4a"),
                  "persistedFileSHA256": capture_hash,
              },
              "screen": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.4,
                  "persistedToProject": True,
                  "videoTrackPresent": True,
                  "projectID": "00000000-0000-0000-0000-000000000103",
                  "recordedLaunchID": "00000000-0000-0000-0000-000000000203",
                  "persistedFilePath": str(root / "screen.mp4"),
                  "persistedFileSHA256": capture_hash,
              },
              "systemAudio": {
                  "permissionGranted": True,
                  "recordingCreated": True,
                  "durationSeconds": 5.4,
                  "persistedToProject": True,
                  "decodedSamples": 48000,
                  "projectID": "00000000-0000-0000-0000-000000000103",
                  "recordedLaunchID": "00000000-0000-0000-0000-000000000203",
                  "persistedFilePath": str(root / "screen.mp4"),
                  "persistedFileSHA256": capture_hash,
              },
              "deniedPermissionHardStopPassed": True,
              "temporaryCleanupPassed": True,
              "appRestartPersistencePassed": True,
              "restartVerifiedLaunchID": "00000000-0000-0000-0000-000000000301",
              "deniedPermissionKinds": [
                  "camera", "microphone", "screen", "systemAudio"
              ],
              "temporaryCleanupKinds": [
                  "camera", "microphone", "screen", "systemAudio"
              ],
          }

          release = {
              "schemaVersion": 2,
              "verifiedAt": "2026-09-19T20:00:00Z",
              "manifestURL": "https://updates.blackstock.app/update-manifest.json",
              "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
              "currentVersion": "0.9.0",
              "currentBuild": 90,
              "targetVersion": "1.0.0",
              "targetBuild": 100,
              "packageSHA256": package_hash,
              "sourceCommitSHA": source_commit,
              "installerTeamID": "ABC123TEAM",
              "manifestSignatureVerified": True,
              "updateAvailabilityVerified": True,
              "packageHashVerified": True,
              "developerIDInstallerVerified": True,
              "staplerValidated": True,
              "gatekeeperInstallerAccepted": True,
              "installedAppPath": "/Applications/Blackstock.app",
              "installedAppVersion": "1.0.0",
              "installedAppBuild": 100,
              "installedAppSourceCommitSHA": source_commit,
              "cameraEntitlementVerified": True,
              "audioInputEntitlementVerified": True,
              "developerIDApplicationVerified": True,
              "gatekeeperApplicationAccepted": True,
              "notarySubmissionID": "00000000-0000-0000-0000-000000000001",
              "notaryStatus": "Accepted",
          }

          updater = {
              "schemaVersion": 2,
              "value": {
                  "id": "00000000-0000-0000-0000-000000000001",
                  "currentVersion": "0.9.0",
                  "currentBuild": 90,
                  "manifestURL": "https://updates.blackstock.app/update-manifest.json",
                  "expectedInstallerTeamID": "ABC123TEAM",
                  "startedAt": 810000000.0,
                  "targetVersion": "1.0.0",
                  "targetBuild": 100,
                  "targetSourceCommitSHA": source_commit,
                  "packageURL": "https://updates.blackstock.app/Blackstock.pkg",
                  "packageSHA256": package_hash,
                  "manifestVerifiedAt": 810000001.0,
                  "packageIntegrityVerifiedAt": 810000002.0,
                  "installerTeamVerifiedAt": 810000002.0,
                  "installerOpenedAt": 810000003.0,
                  "observedInstalledVersion": "1.0.0",
                  "observedInstalledBuild": 100,
                  "observedInstalledSourceCommitSHA": source_commit,
                  "postUpdateLaunchVerifiedAt": 810000004.0,
              },
          }

          (root / "capture.json").write_text(json.dumps(capture))
          (root / "release.json").write_text(json.dumps(release))
          (root / "updater.json").write_text(json.dumps(updater))
          PY

          python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json" \
            --output "$ROOT/market-readiness.json"
          grep -q '"ready": true' "$ROOT/market-readiness.json"

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["packageSHA256"] = "b" * 64
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Cross-release mismatch was unexpectedly accepted." >&2
            exit 1
          fi

          python3 - "$ROOT/updater.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["value"]["packageSHA256"] = "a" * 64
          data["value"]["observedInstalledSourceCommitSHA"] = "2" * 40
          json.dump(data, open(path, "w"))
          PY

          if python3 Build/verify_market_readiness.py \
            --capture-evidence "$ROOT/capture.json" \
            --production-release-evidence "$ROOT/release.json" \
            --in-app-update-evidence "$ROOT/updater.json"; then
            echo "Source-commit mismatch was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Update signing key-pair audit
        run: |
          set -euo pipefail
          PRIVATE="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(1, 33))).decode())')"
          PUBLIC="$(BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$PRIVATE" swift -e 'import CryptoKit; import Foundation; let raw = Data(base64Encoded: ProcessInfo.processInfo.environment["BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64"]!)!; let key = try! Curve25519.Signing.PrivateKey(rawRepresentation: raw); print(key.publicKey.rawRepresentation.base64EncodedString())')"

          BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$PRIVATE" \
          BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64="$PUBLIC" \
            swift Build/verify_update_key_pair.swift

          OTHER_PRIVATE="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(33, 65))).decode())')"
          if BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$OTHER_PRIVATE" \
             BLACKSTOCK_UPDATE_PUBLIC_KEY_BASE64="$PUBLIC" \
             swift Build/verify_update_key_pair.swift; then
            echo "Mismatched update signing keys were unexpectedly accepted." >&2
            exit 1
          fi

      - name: Production release workflow audit
        run: python3 Build/audit_production_release_workflows.py
      - name: Production package configuration audit
        run: |
          set -euo pipefail
          KEY="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(32))).decode())')"

          python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$KEY" \
            --installer-team-id "ABC123TEAM"

          for BAD_URL in \
            "http://updates.blackstock.app/update-manifest.json" \
            "https://localhost/update-manifest.json" \
            "https://updates.blackstock.invalid" \
            "https://user:pass@updates.blackstock.app/update-manifest.json" \
            "https://updates.blackstock.app/update-manifest.json#fragment"
          do
            if python3 Build/validate_production_package_config.py \
              --manifest-url "$BAD_URL" \
              --public-key-base64 "$KEY" \
              --installer-team-id "ABC123TEAM"; then
              echo "Invalid production manifest URL was unexpectedly accepted: $BAD_URL" >&2
              exit 1
            fi
          done

          BAD_KEY="$(python3 -c 'import base64; print(base64.b64encode(bytes(range(31))).decode())')"
          if python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$BAD_KEY" \
            --installer-team-id "ABC123TEAM"; then
            echo "Invalid production update public key was unexpectedly accepted." >&2
            exit 1
          fi

          if python3 Build/validate_production_package_config.py \
            --manifest-url "https://updates.blackstock.app/update-manifest.json" \
            --public-key-base64 "$KEY" \
            --installer-team-id "ABC-123"; then
            echo "Invalid production installer Team ID was unexpectedly accepted." >&2
            exit 1
          fi

      - name: Production package fail-closed audit
        run: |
          set -euo pipefail

          if BLACKSTOCK_PRODUCTION_RELEASE=1 \
            BLACKSTOCK_INCLUDE_E2E_SMOKE=1 \
            bash Build/package.sh "$RUNNER_TEMP/forbidden-production-e2e"; then
            echo "Production package unexpectedly allowed the CI-only E2E helper." >&2
            exit 1
          fi

          if BLACKSTOCK_PRODUCTION_RELEASE=1 \
            BLACKSTOCK_INCLUDE_E2E_SMOKE=0 \
            bash Build/package.sh "$RUNNER_TEMP/incomplete-production"; then
            echo "Production package unexpectedly accepted missing release configuration." >&2
            exit 1
          fi
      - name: Swift tests
        run: swift test
      - name: Release build
        run: swift build -c release

  package:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build development package
        env:
          BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLACKSTOCK_GOOGLE_OAUTH_CLIENT_ID }}
          BLACKSTOCK_SOURCE_COMMIT_SHA: ${{ github.sha }}
          BLACKSTOCK_INCLUDE_E2E_SMOKE: "1"
        run: |
          chmod +x Build/package.sh
          Build/package.sh "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Blackstock.pkg"
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'Applications/Blackstock.app'
          pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke'
          if pkgutil --payload-files "$RUNNER_TEMP/dist/Blackstock.pkg" | grep -q 'BlackstockReleaseVerifier'; then
            echo "Developer release verifier must not ship in Blackstock.pkg." >&2
            exit 1
          fi
      - name: Exercise signed update manifest tooling
        run: |
          set -euo pipefail
          KEY="$(swift -e 'import CryptoKit; import Foundation; print(Curve25519.Signing.PrivateKey().rawRepresentation.base64EncodedString())')"
          export BLACKSTOCK_UPDATE_PRIVATE_KEY_BASE64="$KEY"
          swift Build/generate_update_manifest.swift \
            --package "$RUNNER_TEMP/dist/Blackstock.pkg" \
            --package-url "https://updates.blackstock.invalid/Blackstock.pkg" \
            --version "0.1.0" \
            --build "1" \
            --source-commit-sha "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/dist/update-manifest.json"

          test -s "$RUNNER_TEMP/dist/update-manifest.json"
          EXPECTED_SHA="$(shasum -a 256 "$RUNNER_TEMP/dist/Blackstock.pkg" | awk '{print $1}')"
          ACTUAL_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/dist/update-manifest.json")"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "0.1.0"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "1"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceCommitSHA"])' "$RUNNER_TEMP/dist/update-manifest.json")" = "$GITHUB_SHA"
          test -n "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["signature"])' "$RUNNER_TEMP/dist/update-manifest.json")"

      - name: Install package on clean runner
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Blackstock.app
          sudo installer -pkg "$RUNNER_TEMP/dist/Blackstock.pkg" -target /
          test -x /Applications/Blackstock.app/Contents/MacOS/Blackstock
          test -x /Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke
          plutil -lint /Applications/Blackstock.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Blackstock.app/Contents/Info.plist)" = "de.blackstock.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BlackstockSourceCommitSHA' /Applications/Blackstock.app/Contents/Info.plist)" = "${GITHUB_SHA}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' /Applications/Blackstock.app/Contents/Info.plist)" = "13.0"
          codesign --verify --deep --strict --verbose=2 /Applications/Blackstock.app
          codesign --display --verbose=4 /Applications/Blackstock.app 2>&1 \
            | grep -qi 'runtime'

          ENTITLEMENTS="$RUNNER_TEMP/blackstock-entitlements.txt"
          codesign --display --entitlements :- /Applications/Blackstock.app \
            >"$ENTITLEMENTS" 2>&1
          python3 - "$ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          start = text.find("<?xml")
          end = text.rfind("</plist>")
          if start < 0 or end < 0:
              raise SystemExit("codesign did not emit a readable entitlements plist")
          payload = text[start:end + len("</plist>")].encode()
          values = plistlib.loads(payload)
          assert values.get("com.apple.security.device.camera") is True
          assert values.get("com.apple.security.device.audio-input") is True
          PY
      - name: Launch installed app on clean runner
        run: |
          set -euo pipefail
          APP_BIN="/Applications/Blackstock.app/Contents/MacOS/Blackstock"
          LOG="$RUNNER_TEMP/blackstock-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          pid=$!

          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Blackstock exited during the launch-stability window."
            cat "$LOG" || true
            exit 1
          fi

          kill -TERM "$pid"
          for _ in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done

          kill -KILL "$pid" 2>/dev/null || true
          echo "Blackstock required a forced stop after smoke testing."
          cat "$LOG" || true
          exit 1

      - name: Run installed creator-loop E2E
        run: |
          set -euo pipefail
          E2E_BIN="/Applications/Blackstock.app/Contents/Helpers/BlackstockE2ESmoke"
          RESULT="$RUNNER_TEMP/blackstock-clean-machine-e2e.json"
          LOG="$RUNNER_TEMP/blackstock-clean-machine-e2e.log"

          "$E2E_BIN" --output "$RESULT" | tee "$LOG"
          grep -q 'BLACKSTOCK_E2E_PASS' "$LOG"
          test -s "$RESULT"

          python3 - "$RESULT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["generatedSource"] is True
          assert data["rendered"] is True
          assert data["renderValidated"] is True
          assert data["audioTrackValidated"] is True
          assert data["pcmSamplesAnalyzed"] > 0
          assert isinstance(data["integratedLUFS"], (int, float))
          assert isinstance(data["truePeakDBTP"], (int, float))
          assert data["qualityReviewPassed"] is True
          assert data["uploadVideoID"] == "e2e-video-123"
          assert data["uploadJournalCommitted"] is True
          assert data["analyticsViews"] == 1234
          assert data["learningFactCount"] > 0
          assert data["persistenceRoundTrip"] is True
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Blackstock-development-pkg
          path: |
            ${{ runner.temp }}/dist/Blackstock.pkg
            ${{ runner.temp }}/dist/Blackstock.pkg.sha256
          retention-days: 7
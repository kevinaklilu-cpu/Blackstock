name: Blackstock Source Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Patches/Release1000/**'
      - '.github/workflows/reconstruct-source-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: blackstock-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Blackstock Source rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          "$GITHUB_WORKSPACE/Patches/Release1000/reconstruct-flow.sh"
          "$GITHUB_WORKSPACE/Build/Market-Readiness-Audit.sh"
      - name: Blackstock Source-Snapshot hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Blackstock-final-source
          retention-days: 1
          if-no-files-found: error
          path: |
            Sources/Blackstock/Views/*.swift
            Sources/Blackstock/Models/*.swift
            Sources/Blackstock/Services/*.swift
            Sources/Blackstock/AppStore*.swift
            Build/*.sh
            Build/*.zsh
            Build/version.env
            RELEASE_MANIFEST.txt
